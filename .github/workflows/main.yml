name: Monitor Volcanico VRP 

on:
  workflow_dispatch: 

concurrency:
  group: monitor-vrp
  cancel-in-progress: true

# Red de seguridad: fuerza Node 24 en cualquier acción aún en Node 20
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar Scraper
        run: python scraper.py

      - name: Guardar cambios en GitHub
        run: |
          git config --global user.name "VolcanoBot"
          git config --global user.email "bot@volcano.com"
          # add selectivo: solo lo que genera el scraper (no archivos sueltos)
          git add monitoreo_satelital/
          if ! git diff --quiet --staged; then
            git commit -m "Auto: Sincronización de datos e imágenes"
            # Push con reintentos. Cinco workflows escriben main y cada uno
            # tiene su propio grupo de concurrency, así que la concurrency no
            # los protege entre sí: entre el pull y el push hay una ventana de
            # segundos en la que otro workflow puede empujar primero y el push
            # se rechaza con "cannot lock ref". Por eso el pull va DENTRO del
            # bucle, para rebasar sobre lo que haya llegado en el intento
            # anterior. Este workflow es el más frecuente del repo (~446
            # corridas en 14 días), o sea el que más expuesto está a la carrera.
            # --autostash: tolera modificaciones no stageadas (ej. archivos
            # regenerados por el runner) que harían fallar el rebase
            for i in 1 2 3 4 5; do
              git pull origin main --rebase --autostash -X ours || true
              if git push origin main; then echo "✅ push OK (intento $i)"; exit 0; fi
              echo "⚠️ push rechazado, reintento $i..."; sleep $((i*3))
            done
            echo "❌ push falló tras 5 intentos"; exit 1
          else
            echo "No hay cambios nuevos para subir."
          fi
