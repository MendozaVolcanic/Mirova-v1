name: Monitor Volcanico VRP 

on:
  workflow_dispatch:
  # Respaldo del disparador externo (auditoria 2026-10-22, H-P3): si el despachador de
  # cada 5 min se apaga, el scraper sigue corriendo cada 30 min en vez de detenerse sin aviso.
  schedule:
    - cron: '17,47 * * * *'

concurrency:
  group: monitor-vrp
  # false: una corrida nueva espera en vez de cortar a otra a mitad del push. Con el ciclo de
  # abajo cada corrida parte del main de ese momento, asi que esperar no la deja con base vieja.
  cancel-in-progress: false

# Red de seguridad: fuerza Node 24 en cualquier acción aún en Node 20
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # POR QUE este ciclo (auditoria 2026-10-22, H-T1): antes el scraper corria una
      # vez y, si el push se rechazaba, hacia `git pull --rebase -X ours`. Eso mezcla
      # como TEXTO un CSV que se reescribe entero: con dos ciclos de por medio git dejo
      # filas dos veces o ninguna (2.165 filas perdidas en la historia, 18 alertas de
      # 1 MW o mas), y el workflow terminaba en verde. Ahora los datos nunca se mezclan:
      # cada intento parte del main de ESE momento (no del sha del despacho, que puede
      # ser viejo), corre el scraper sobre el archivo fresco, revisa que no se pierda
      # ni se repita ninguna llave y recien entonces empuja. Si otro workflow empujo
      # primero, se descarta el intento y se rehace. Mismo patron que el paso
      # "Distancia aproximada" de ocr_workflow.yml.
      #
      # backfill_horas_utc (issue #23) rellena las horas UTC de filas viejas desde la
      # hora de Chile; idempotente. Va aca y no como commit de datos porque este CSV
      # se reescribe cada 5 minutos.
      #
      # scraper.py sale con 1 si latest.php falla o cambia de forma: con `bash -e`
      # (el shell por defecto de Actions) la corrida queda en rojo y no commitea.
      - name: Scraper, guarda y push (sin mezclar datos)
        run: |
          git config --global user.name "VolcanoBot"
          git config --global user.email "bot@volcano.com"
          CSV=monitoreo_satelital/registro_vrp_consolidado.csv
          for i in 1 2 3 4 5; do
            git fetch --depth=1 origin main
            git reset --hard origin/main
            # Devuelve las 2.351 filas que perdieron las mezclas de 2026 (idempotente: una
            # vez repuestas no cambia nada; ver reponer_filas.py). Va antes del scraper para
            # que positivos y el maestro las vean en el mismo ciclo.
            python reponer_filas.py
            python scraper.py
            python backfill_horas_utc.py "$CSV"
            python guarda_llaves.py "$CSV" --ref origin/main
            # add selectivo: solo lo que genera el scraper (no archivos sueltos)
            git add monitoreo_satelital/
            if git diff --quiet --staged; then
              echo "No hay cambios nuevos para subir."; exit 0
            fi
            git commit -m "Auto: Sincronización de datos e imágenes"
            if git push origin main; then echo "✅ push OK (intento $i)"; exit 0; fi
            echo "⚠️ push rechazado: se rehace el ciclo sobre el main nuevo (intento $i)"
            sleep $((i*3))
          done
          echo "❌ push falló tras 5 intentos"; exit 1
