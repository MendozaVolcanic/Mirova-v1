name: Unificar Carpetas Puyehue

on:
  workflow_dispatch:  # Solo ejecución manual

permissions:
  contents: write

jobs:
  unificar:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Ejecutar unificación
        run: |
          python unificar_carpetas_puyehue.py
      
      - name: Commit cambios
        run: |
          git config user.name "UnifyBot"
          git config user.email "unify@mirova.com"
          
          # Agregar carpeta correcta y eliminar incorrecta
          git add monitoreo_satelital/imagenes_satelitales/Puyehue-Cordon\ Caulle/
          git add -u monitoreo_satelital/imagenes_satelitales/Puyehue_Cordon_Caulle/ 2>/dev/null || true
          
          if ! git diff --quiet --staged; then
            git commit -m "Unificar carpetas Puyehue (eliminar Puyehue_Cordon_Caulle)"
            git push origin main
            echo "✅ Carpetas unificadas"
          else
            echo "ℹ️ No hay cambios"
          fi
