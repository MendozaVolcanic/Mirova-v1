name: Generador de Graficos

on:
  workflow_run:
    workflows: ["Monitor Volcanico VRP"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: generador-graficos
  cancel-in-progress: true

# Red de seguridad: fuerza Node 24 en cualquier acción aún en Node 20
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  pintar_y_publicar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write        # ✅ NECESARIO para deploy
      id-token: write     # ✅ NECESARIO para deploy

    # ✅ Requerido por deploy-pages@v4: sin este environment el deploy
    #    devuelve 401 "Requires authentication" (token OIDC sin alcance).
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Preparar entorno
        run: |
          mkdir -p monitoreo_satelital/v_html/
          mkdir -p monitoreo_satelital/v_html_log/
          rm -rf monitoreo_satelital/v_html/*
          rm -rf monitoreo_satelital/v_html_log/*

      - name: Ejecutar el Visualizador
        run: python visualizador.py

      - name: Guardar en GitHub
        run: |
          git config --global user.name "VolcanoVisualizer"
          git config --global user.email "viz@volcano.com"
          
          git add monitoreo_satelital/v_html/*.html 2>/dev/null || true
          git add monitoreo_satelital/v_html_log/*.html 2>/dev/null || true
          git add monitoreo_satelital/estado_sistema.json 2>/dev/null || true
          git add volcanes.js 2>/dev/null || true
          
          if ! git diff --quiet --staged; then
            git commit -m "📊 Generación automática de gráficos"
            git pull origin main --no-rebase --strategy-option=ours || true
            
            max_retries=3
            retry_count=0
            
            while [ $retry_count -lt $max_retries ]; do
              if git push origin main; then
                echo "✅ Push exitoso"
                break
              else
                retry_count=$((retry_count + 1))
                echo "⚠️ Push falló, intento $retry_count de $max_retries"
                
                if [ $retry_count -lt $max_retries ]; then
                  sleep 2
                  git pull origin main --no-rebase --strategy-option=ours || true
                fi
              fi
            done
          else
            echo "No hay cambios nuevos para subir."
          fi
      
      # ========================================
      # DEPLOY A GITHUB PAGES - MIROVA-V1
      # ========================================
      # El dashboard (index.html) solo consume: volcanes.js, los gráficos
      # interactivos de v_html/ y v_html_log/, los registro_*.csv y
      # estado_sistema.json. Las 4400+ PNG de imagenes_satelitales/ NO se
      # referencian desde el sitio: empaquetarlas hacía que el paso
      # syncing_files de deploy-pages sincronizara miles de archivos al CDN
      # y fallara de forma intermitente ("Deployment failed, try again later").
      # Publicamos solo lo que el dashboard necesita; las PNG siguen en el
      # repo (accesibles vía su URL de GitHub / raw.githubusercontent.com).
      - name: Preparar sitio publicable
        run: |
          rm -rf _site
          mkdir -p _site/monitoreo_satelital/v_html _site/monitoreo_satelital/v_html_log
          cp index.html volcanes.js _site/
          cp monitoreo_satelital/v_html/*.html         _site/monitoreo_satelital/v_html/      2>/dev/null || true
          cp monitoreo_satelital/v_html_log/*.html     _site/monitoreo_satelital/v_html_log/  2>/dev/null || true
          cp monitoreo_satelital/estado_sistema.json   _site/monitoreo_satelital/             2>/dev/null || true
          cp monitoreo_satelital/registro_*.csv        _site/monitoreo_satelital/             2>/dev/null || true
          echo "Archivos en el sitio publicable: $(find _site -type f | wc -l)"
          find _site -type f | sort

      - name: Configurar Pages
        uses: actions/configure-pages@v6

      - name: Subir artefacto a Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: '_site'  # ✅ Solo el dashboard, no las 4400+ PNG de evidencia

      # Deploy resiliente. GitHub Pages solo admite UN deployment activo por
      # sitio. Como este workflow corre cada ~5 min (disparado por el scraper),
      # a veces dispara mientras el backend de Pages aun finaliza el deployment
      # anterior y responde "Deployment failed, try again later" (~25% de los
      # runs). Es transitorio y auto-sanable: el siguiente ciclo redeploya con
      # datos frescos. Para no fallar el run (y no inundar el mail con avisos de
      # fallo) hacemos 2 intentos con espera y toleramos el fallo final.
      - name: Deploy a GitHub Pages (intento 1)
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Esperar si Pages estaba ocupado
        if: steps.deployment.outcome == 'failure'
        run: |
          echo "Primer intento rechazado por Pages; espero 60 s y reintento..."
          sleep 60

      - name: Deploy a GitHub Pages (reintento)
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Estado del deploy
        run: |
          if [ "${{ steps.deployment.outcome }}" = "success" ] || [ "${{ steps.deployment_retry.outcome }}" = "success" ]; then
            echo "OK: deploy a Pages exitoso."
          else
            echo "AVISO: ambos intentos de deploy fallaron (rechazo transitorio de Pages)."
            echo "El proximo ciclo (~5 min) redeployara con datos frescos."
            echo "No se marca el run como fallido a proposito, para no inundar el mail."
          fi