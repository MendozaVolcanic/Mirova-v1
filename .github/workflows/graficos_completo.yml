name: Generar Graficos

on:
  schedule:
    - cron: '*/25 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: graficos-deploy
  cancel-in-progress: true

jobs:
  graficos-y-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Instalar dependencias
        run: |
          pip install pandas numpy plotly pytz
      
      - name: Generar graficos
        run: |
          python visualizador.py
      
      - name: Commit cambios
        run: |
          git config --global user.name "VolcanoVisualizer"
          git config --global user.email "viz@volcano.com"
          
          git add monitoreo_satelital/v_html/*.html 2>/dev/null || true
          git add monitoreo_satelital/v_html_log/*.html 2>/dev/null || true
          git add monitoreo_satelital/estado_sistema.json 2>/dev/null || true
          
          if ! git diff --quiet --staged; then
            git commit -m "📊 Generación automática de gráficos"
            git pull origin main --no-rebase --strategy-option=ours || true
            
            max_retries=3
            retry_count=0
            
            while [ $retry_count -lt $max_retries ]; do
              if git push origin main; then
                echo "✅ Push exitoso"
                break
              else
                retry_count=$((retry_count + 1))
                echo "⚠️ Push falló, intento $retry_count de $max_retries"
                
                if [ $retry_count -lt $max_retries ]; then
                  sleep 2
                  git pull origin main --no-rebase --strategy-option=ours || true
                fi
              fi
            done
          else
            echo "ℹ️ No hay cambios nuevos en gráficos"
          fi
      
      # ========================================
      # DEPLOY A GITHUB PAGES - MIROVA-V1
      # index.html está en RAÍZ del repositorio
      # ========================================
      - name: Configurar Pages
        uses: actions/configure-pages@v4
      
      - name: Subir artefacto a Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'  # ✅ TODO el repo (index.html en raíz)
      
      - name: Deploy a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
