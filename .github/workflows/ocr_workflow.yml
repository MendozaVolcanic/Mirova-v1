name: Scraper OCR

on:
  schedule:
    # Cada 1 hora en el minuto :05
    - cron: '5 * * * *'
  
  # Permitir ejecución manual
  workflow_dispatch:

concurrency:
  group: scraper-ocr
  cancel-in-progress: true

# Red de seguridad: fuerza Node 24 en cualquier acción aún en Node 20
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  ocr_scraper:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng

      - name: Instalar dependencias Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ========================================
      # NUEVO: VERIFICACIÓN ANTES DE EJECUTAR
      # ========================================
      - name: Verificar módulos instalados
        run: |
          echo "🔍 Verificando módulos críticos..."
          
          python -c "import requests; print('✅ requests')" || exit 1
          python -c "import pandas; print('✅ pandas')" || exit 1
          python -c "import pytz; print('✅ pytz')" || exit 1
          python -c "import numpy; print('✅ numpy')" || exit 1
          python -c "import cv2; print('✅ opencv-python')" || exit 1
          python -c "import pytesseract; print('✅ pytesseract')" || exit 1
          python -c "from PIL import Image; print('✅ Pillow')" || exit 1
          
          echo ""
          echo "🧪 Test import ocr_utils..."
          python -c "
          import ocr_utils
          print('✅ ocr_utils importado')
          
          # Verificar funciones
          assert hasattr(ocr_utils, 'extraer_eventos_latest10nti'), 'Falta extraer_eventos_latest10nti'
          assert hasattr(ocr_utils, 'analizar_puntos_distancia'), 'Falta analizar_puntos_distancia'
          assert hasattr(ocr_utils, 'clasificar_confianza'), 'Falta clasificar_confianza'
          assert hasattr(ocr_utils, 'verificar_evento_no_existe'), 'Falta verificar_evento_no_existe'
          
          print('✅ Todas las funciones presentes')
          " || exit 1
          
          echo ""
          echo "✅ VERIFICACIÓN COMPLETA - Listo para ejecutar OCR"
      # ========================================

      - name: Ejecutar Scraper OCR
        run: python scraper_ocr.py

      # V31.1: pasa al registro las pasadas que V31 dejo solo en el log de
      # rechazos (Dist.png POSTERIOR, VRP > 0), con su VRP y SIN distancia.
      # Idempotente: la primera corrida tras el merge agrega las historicas y
      # despues 0 (el scraper ya guarda las nuevas). Va en el workflow y no como
      # datos del PR porque este CSV se reescribe cada hora: un commit de datos
      # en el PR chocaria con el OCR.
      - name: Backfill V31.1 (VRP sin geometria propia)
        run: python backfill_vrp_sin_geometria_v31.py

      # Issue #23: rellena Fecha_Proceso_UTC y Ultima_Actualizacion_UTC de las
      # filas viejas desde la hora de Chile (una hora ambigua queda vacia). Mismo
      # criterio que el paso anterior: va en el workflow y no como datos del PR.
      # Idempotente. Solo toca el CSV del OCR; el consolidado lo rellena main.yml.
      - name: Backfill horas UTC (OCR)
        run: python backfill_horas_utc.py monitoreo_satelital/registro_vrp_ocr.csv

      - name: Reconciliar OCR contra latest.php (auto-corrige mal-ubicaciones)
        run: python reconciliar_latest.py

      - name: Ejecutar Merger Maestro
        run: python merger_maestro.py

      # Los graficos NO se regeneran aca a proposito. visualizador.py reescribe
      # los 22 HTML en cada corrida, pero lo unico que cambia es el UUID
      # aleatorio que Plotly le pone al <div>: sin datos nuevos son ~2 MB de
      # blobs identicos por commit, y este workflow corre ~3 veces por hora.
      # De eso se encarga graficos_completo.yml, que corre cada 5 min y ya sabe
      # decidir si hay algo nuevo que dibujar (compara el hash de los datos
      # contra monitoreo_satelital/.graficos_hash).
      # El dato del OCR igual llega al grafico: el checkout de graficos_completo
      # usa el commit del scraper que lo dispara, y como la historia es lineal
      # ese commit ya incluye lo que el OCR dejo antes. Latencia maxima: un ciclo
      # del scraper (~5 min), contra datos OCR que entran cada ~30 min.

      - name: Guardar cambios en GitHub
        run: |
          git config --global user.name "VolcanoOCR"
          git config --global user.email "ocr@volcano.com"
          # add selectivo: lo que generan OCR y merger (no archivos sueltos).
          # Los HTML de graficos ya no se tocan aca, los publica graficos_completo.yml.
          git add monitoreo_satelital/ volcanes.js
          
          if ! git diff --quiet --staged; then
            git commit -m "🔬 OCR: Captura de eventos satelitales"
            
            # Push con reintentos
            max_retries=5
            retry_count=0
            
            while [ $retry_count -lt $max_retries ]; do
              echo "Intento $((retry_count + 1)) de push..."
              
              if git pull origin main --rebase --autostash -X ours; then
                echo "Pull exitoso, intentando push..."
              else
                echo "⚠️ Pull falló, continuando..."
              fi
              
              if git push origin main; then
                echo "✅ Push exitoso en intento $((retry_count + 1))"
                exit 0
              else
                echo "⚠️ Push falló, esperando antes de reintentar..."
                retry_count=$((retry_count + 1))
                
                if [ $retry_count -lt $max_retries ]; then
                  sleep $((retry_count * 2))
                fi
              fi
            done
            
            echo "❌ Push falló después de $max_retries intentos"
            exit 1
          else
            echo "ℹ️ No hay eventos nuevos para subir."
          fi

      # ========================================
      # Distancia aproximada (Distancia_aprox_*), DESPUES del commit del OCR
      # ========================================
      # La distancia de cada pasada VIIRS 375 leida en la serie de tiempo de
      # Dist.png de 1 a 25 dias despues (backfill_distancia_aprox.py). Es un
      # complemento: Distancia_km no se toca. Va despues del push del OCR para
      # que el OCR nunca dependa de el: si esto falla o lo cancela la corrida
      # siguiente, el OCR ya esta arriba. Mismo workflow (mismo grupo de
      # concurrencia) para que registro_vrp_ocr.csv siga teniendo un solo
      # escritor. Cada intento parte del remoto (reset a origin/main) y recalcula,
      # asi que un push rechazado nunca mezcla versiones del CSV.
      # Presupuesto 5 min: los disparos llegan cada 30 min y el OCR toma 2 a 4.
      # Medido (2026-10-16, copia del CSV real): ventana de 26 dias 6 a 30 s.
      # La historia se calcula una vez con distancia_aprox_historia.yml (deja los
      # calados en la cache); con eso esta corrida la escribe dentro del presupuesto.
      # Errores por fila (red, PNG, volcan nuevo) quedan como error_lectura y salen
      # como ::warning:: en el resumen; un error de toda la corrida deja el paso en rojo.
      - name: Restaurar cache de Dist.png y calados
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/mirova_dist
          key: mirova-dist-${{ github.run_id }}
          restore-keys: mirova-dist-

      - name: Distancia aproximada (serie de tiempo de Dist.png)
        timeout-minutes: 10
        run: |
          for intento in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python backfill_distancia_aprox.py --dias 26 --max-minutos 5
            git add monitoreo_satelital/registro_vrp_ocr.csv
            if git diff --quiet --staged; then
              echo "Sin cambios en Distancia_aprox_*"
              exit 0
            fi
            git commit -m "Distancia aproximada: Distancia_aprox_* desde la serie de Dist.png"
            if git push origin main; then
              echo "Push de la distancia aproximada en el intento $intento"
              exit 0
            fi
            echo "Push rechazado (otro workflow empujo primero): reintento sobre el remoto"
            sleep $((intento * 3))
          done
          echo "::warning title=Distancia aproximada::push rechazado 5 veces; lo retoma la proxima corrida"

      - name: Guardar cache de Dist.png y calados
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/mirova_dist
          key: mirova-dist-${{ github.run_id }}
