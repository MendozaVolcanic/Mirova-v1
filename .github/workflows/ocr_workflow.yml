name: Scraper OCR

on:
  schedule:
    # Cada 1 hora en el minuto :05
    - cron: '5 * * * *'
  
  # Permitir ejecución manual
  workflow_dispatch:

concurrency:
  group: scraper-ocr
  cancel-in-progress: true

jobs:
  ocr_scraper:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng

      - name: Instalar dependencias Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ========================================
      # NUEVO: VERIFICACIÓN ANTES DE EJECUTAR
      # ========================================
      - name: Verificar módulos instalados
        run: |
          echo "🔍 Verificando módulos críticos..."
          
          python -c "import requests; print('✅ requests')" || exit 1
          python -c "import pandas; print('✅ pandas')" || exit 1
          python -c "import pytz; print('✅ pytz')" || exit 1
          python -c "import numpy; print('✅ numpy')" || exit 1
          python -c "import cv2; print('✅ opencv-python')" || exit 1
          python -c "import pytesseract; print('✅ pytesseract')" || exit 1
          python -c "from PIL import Image; print('✅ Pillow')" || exit 1
          
          echo ""
          echo "🧪 Test import ocr_utils..."
          python -c "
          import ocr_utils
          print('✅ ocr_utils importado')
          
          # Verificar funciones
          assert hasattr(ocr_utils, 'extraer_eventos_latest10nti'), 'Falta extraer_eventos_latest10nti'
          assert hasattr(ocr_utils, 'analizar_puntos_distancia'), 'Falta analizar_puntos_distancia'
          assert hasattr(ocr_utils, 'clasificar_confianza'), 'Falta clasificar_confianza'
          assert hasattr(ocr_utils, 'verificar_evento_no_existe'), 'Falta verificar_evento_no_existe'
          
          print('✅ Todas las funciones presentes')
          " || exit 1
          
          echo ""
          echo "✅ VERIFICACIÓN COMPLETA - Listo para ejecutar OCR"
      # ========================================

      - name: Ejecutar Scraper OCR
        run: python scraper_ocr.py

      - name: Ejecutar Merger Maestro
        run: python merger_maestro.py

      - name: Regenerar Gráficos
        run: python visualizador.py

      - name: Guardar cambios en GitHub
        run: |
          git config --global user.name "VolcanoOCR"
          git config --global user.email "ocr@volcano.com"
          git add -A
          
          if ! git diff --quiet --staged; then
            git commit -m "🔬 OCR: Captura de eventos satelitales"
            
            # Push con reintentos
            max_retries=5
            retry_count=0
            
            while [ $retry_count -lt $max_retries ]; do
              echo "Intento $((retry_count + 1)) de push..."
              
              if git pull origin main --rebase -X ours; then
                echo "Pull exitoso, intentando push..."
              else
                echo "⚠️ Pull falló, continuando..."
              fi
              
              if git push origin main; then
                echo "✅ Push exitoso en intento $((retry_count + 1))"
                exit 0
              else
                echo "⚠️ Push falló, esperando antes de reintentar..."
                retry_count=$((retry_count + 1))
                
                if [ $retry_count -lt $max_retries ]; then
                  sleep $((retry_count * 2))
                fi
              fi
            done
            
            echo "❌ Push falló después de $max_retries intentos"
            exit 1
          else
            echo "ℹ️ No hay eventos nuevos para subir."
          fi
