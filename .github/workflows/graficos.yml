name: Generar Graficos

on:
  schedule:
    - cron: '*/25 * * * *'  # Cada 25 minutos
  workflow_dispatch:

permissions:
  contents: write

jobs:
  graficos:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Instalar dependencias
        run: |
          pip install pandas numpy plotly pytz
      
      - name: Generar graficos
        run: |
          python visualizador.py
      
      - name: Commit y push cambios
        run: |
          git config --global user.name "VolcanoVisualizer"
          git config --global user.email "viz@volcano.com"
          
          # ========================================
          # FIX: Agregar TODOS los cambios antes de commit
          # ========================================
          git add monitoreo_satelital/v_html/*.html 2>/dev/null || true
          git add monitoreo_satelital/v_html_log/*.html 2>/dev/null || true
          git add monitoreo_satelital/estado_sistema.json 2>/dev/null || true
          
          # Verificar si hay cambios
          if ! git diff --quiet --staged; then
            # Commit PRIMERO
            git commit -m "📊 Generación automática de gráficos"
            
            # ========================================
            # FIX: Pull DESPUÉS de commit
            # Opciones:
            # 1. Pull con merge (más seguro)
            # 2. Pull con rebase (más limpio)
            # ========================================
            
            # Opción 1: Pull con merge (RECOMENDADO para workflows automáticos)
            git pull origin main --no-rebase --strategy-option=ours || true
            
            # Push con retry
            max_retries=3
            retry_count=0
            
            while [ $retry_count -lt $max_retries ]; do
              if git push origin main; then
                echo "✅ Push exitoso"
                exit 0
              else
                retry_count=$((retry_count + 1))
                echo "⚠️ Push falló, intento $retry_count de $max_retries"
                
                if [ $retry_count -lt $max_retries ]; then
                  sleep 2
                  git pull origin main --no-rebase --strategy-option=ours || true
                fi
              fi
            done
            
            echo "❌ Push falló después de $max_retries intentos"
            exit 1
          else
            echo "ℹ️ No hay cambios nuevos para subir."
          fi
